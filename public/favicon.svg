<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1D"/>
      <stop offset="100%" stop-color="#03040B"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#145CFF"/>
      <stop offset="100%" stop-color="#FF28D7"/>
    </linearGradient>
  </defs>
  <!-- Background polygon -->
  <polygon points="12,4 52,4 60,12 60,52 52,60 12,60 4,52 4,12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3"/>
  <!-- Code brackets -->
  <text x="32" y="42" font-family="monospace, monospace" font-size="26" font-weight="900" text-anchor="middle" fill="#00E5FF">
    &lt;<tspan fill="#FF28D7">/</tspan>&gt;
  </text>
